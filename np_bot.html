<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NP BOT - G13</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#14b8a6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link id="manifest-link" rel="manifest">
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide number input spinners for cleaner look */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center p-4 sm:p-6">

    <div class="w-full max-w-md w-full pb-10">
        <!-- Header -->
        <header class="text-center mb-6 mt-4">
            <h1 class="text-3xl font-bold text-teal-500 tracking-tight">NP BOT - G13</h1>
            <p class="text-sm text-gray-500 mt-1">Calcolatore Infusione Medica</p>
        </header>

        <!-- Input Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Parametri</h2>
            
            <!-- Interruttore Con/Senza Lipidi -->
            <div class="flex bg-gray-100 rounded-xl p-1 mb-5">
                <button id="btn-con-lipidi" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow-sm text-teal-500 transition-all">Con lipidi</button>
                <button id="btn-senza-lipidi" class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-gray-600 transition-all">Senza lipidi</button>
            </div>

            <div class="space-y-5">
                <div>
                    <label for="peso" class="block text-sm font-medium text-gray-600 mb-1">Peso paziente (kg)</label>
                    <input type="number" id="peso" inputmode="decimal" step="any" value="1" 
                           class="w-full text-2xl p-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-transparent transition-all"
                           placeholder="Es. 70">
                </div>

                <div>
                    <label for="velocita" class="block text-sm font-medium text-gray-600 mb-1">Velocità d'infusione (ml/h)</label>
                    <input type="number" id="velocita" inputmode="decimal" step="any" value="5" 
                           class="w-full text-2xl p-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-transparent transition-all"
                           placeholder="Es. 5">
                </div>
            </div>
        </div>

        <!-- Output Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Risultati</h2>
            
            <div class="space-y-3">
                <!-- Result Rows -->
                <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <span class="text-gray-500 font-medium">RG <span class="text-xs font-normal">(mg/kg/min)</span></span>
                    <span id="out-rg" class="text-xl font-bold text-gray-900">-</span>
                </div>
                
                <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <span class="text-gray-500 font-medium">AA <span class="text-xs font-normal">(g/kg/die)</span></span>
                    <span id="out-aa" class="text-xl font-bold text-gray-900">-</span>
                </div>

                <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <span class="text-gray-500 font-medium">L <span class="text-xs font-normal">(g/kg/die)</span></span>
                    <span id="out-l" class="text-xl font-bold text-gray-900">-</span>
                </div>

                <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <span class="text-gray-500 font-medium">Na <span class="text-xs font-normal">(mEq/kg/die)</span></span>
                    <span id="out-na" class="text-xl font-bold text-gray-900">-</span>
                </div>

                <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <span class="text-gray-500 font-medium">Ca <span class="text-xs font-normal">(mg/kg/die)</span></span>
                    <span id="out-ca" class="text-xl font-bold text-gray-900">-</span>
                </div>

                <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <span class="text-gray-500 font-medium">K <span class="text-xs font-normal">(mEq/kg/die)</span></span>
                    <span id="out-k" class="text-xl font-bold text-gray-900">-</span>
                </div>

                <div class="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <span class="text-gray-500 font-medium">P <span class="text-xs font-normal">(mg/kg/die)</span></span>
                    <span id="out-p" class="text-xl font-bold text-gray-900">-</span>
                </div>

                <div class="flex justify-between items-center py-3 mt-2 bg-teal-50 px-4 rounded-lg">
                    <span class="text-teal-800 font-bold">Qi NP</span>
                    <span id="out-qinp" class="text-2xl font-black text-teal-600">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputPeso = document.getElementById('peso');
            const inputVelocita = document.getElementById('velocita');

            // Output elements
            const outRG = document.getElementById('out-rg');
            const outAA = document.getElementById('out-aa');
            const outL = document.getElementById('out-l');
            const outNa = document.getElementById('out-na');
            const outCa = document.getElementById('out-ca');
            const outK = document.getElementById('out-k');
            const outP = document.getElementById('out-p');
            const outQiNP = document.getElementById('out-qinp');

            // Logica Interruttore Lipidi
            const btnConLipidi = document.getElementById('btn-con-lipidi');
            const btnSenzaLipidi = document.getElementById('btn-senza-lipidi');
            let hasLipidi = true;

            btnConLipidi.addEventListener('click', () => {
                hasLipidi = true;
                btnConLipidi.classList.add('bg-white', 'shadow-sm', 'text-teal-500', 'font-bold');
                btnConLipidi.classList.remove('text-gray-400', 'font-medium');
                btnSenzaLipidi.classList.remove('bg-white', 'shadow-sm', 'text-teal-500', 'font-bold');
                btnSenzaLipidi.classList.add('text-gray-400', 'font-medium');
                updateCalculations();
            });

            btnSenzaLipidi.addEventListener('click', () => {
                hasLipidi = false;
                btnSenzaLipidi.classList.add('bg-white', 'shadow-sm', 'text-teal-500', 'font-bold');
                btnSenzaLipidi.classList.remove('text-gray-400', 'font-medium');
                btnConLipidi.classList.remove('bg-white', 'shadow-sm', 'text-teal-500', 'font-bold');
                btnConLipidi.classList.add('text-gray-400', 'font-medium');
                updateCalculations();
            });

            function updateCalculations() {
                const peso = parseFloat(inputPeso.value);
                const velocita = parseFloat(inputVelocita.value);

                // Validation and Zero check
                if (isNaN(peso) || isNaN(velocita) || peso <= 0) {
                    resetOutputs();
                    return;
                }

                let rg, aa, l, na, ca, k, p, qinp;

                if (hasLipidi) {
                    // Formule G13: Con lipidi
                    rg = (13.3 * velocita) / (6 * peso);
                    aa = (velocita * 24 * 9.4) / (300 * peso);
                    l = (velocita * 24 * 7.5) / (300 * peso);
                    na = (velocita * 24 * 6.6) / (300 * peso);
                    ca = (velocita * 24 * 3.8 * 40) / (300 * peso);
                    k = (velocita * 24 * 6.2) / (300 * peso);
                    p = (velocita * 24 * 3.8 * 30.97) / (300 * peso);
                    qinp = (velocita * 24) / peso;
                } else {
                    // Formule G13: Senza lipidi
                    rg = (16.7 * velocita) / (6 * peso);
                    aa = (velocita * 24 * 3.9) / (100 * peso);
                    l = 0; // Lipidi assenti
                    na = (velocita * 24 * 2.7) / (100 * peso);
                    ca = (velocita * 24 * 1.6 * 40) / (100 * peso);
                    k = (velocita * 24 * 2.6) / (100 * peso);
                    p = (velocita * 24 * 1.3 * 30.97) / (100 * peso);
                    qinp = (velocita * 24) / peso;
                }

                // Update UI rounded to 2 decimal places
                outRG.textContent = rg.toFixed(2);
                outAA.textContent = aa.toFixed(2);
                outL.textContent = l.toFixed(2);
                outNa.textContent = na.toFixed(2);
                outCa.textContent = ca.toFixed(2);
                outK.textContent = k.toFixed(2);
                outP.textContent = p.toFixed(2);
                outQiNP.textContent = qinp.toFixed(2);
            }

            function resetOutputs() {
                const dash = "-";
                outRG.textContent = dash;
                outAA.textContent = dash;
                outL.textContent = dash;
                outNa.textContent = dash;
                outCa.textContent = dash;
                outK.textContent = dash;
                outP.textContent = dash;
                outQiNP.textContent = dash;
            }

            // Attach event listeners for real-time calculation
            inputPeso.addEventListener('input', updateCalculations);
            inputVelocita.addEventListener('input', updateCalculations);

            // Run once on load to populate defaults
            updateCalculations();
        });
    </script>

</body>
</html>
