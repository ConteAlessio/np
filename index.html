<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - NP BOT</title>
    <meta name="theme-color" content="#374151">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
    <script>
        // SE GIA' LOGGATO, SALTA IL LOGIN E VAI ALL'APP
        if (localStorage.getItem('np_auth') === 'true') {
            window.location.href = 'app.html';
        }
    </script>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
        
        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-1">Area Riservata</h1>
        <p class="text-sm text-gray-500 mb-6">Inserisci la password per accedere a NP BOT.</p>

        <form id="login-form" class="space-y-4">
            <div>
                <input type="password" id="password" required
                       class="w-full text-center text-lg p-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-gray-800 transition-all"
                       placeholder="Password">
            </div>
            
            <p id="error-msg" class="text-red-500 text-sm hidden font-medium">Password errata, riprova.</p>

            <button type="submit" class="w-full py-3 font-bold text-white bg-gray-800 hover:bg-gray-900 rounded-xl transition-colors shadow-sm">
                Accedi
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputPwd = document.getElementById('password').value;
            
            // ==========================================
            // MODIFICA QUI LA TUA PASSWORD DI ACCESSO
            const PASSWORD_CORRETTA = "np"; 
            // ==========================================

            if (inputPwd === PASSWORD_CORRETTA) {
                // Salva l'accesso nel dispositivo e reindirizza
                localStorage.setItem('np_auth', 'true');
                window.location.href = 'app.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
